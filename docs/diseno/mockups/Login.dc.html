<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingreso al panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D3A}a:hover{color:#17211B}
input,button{font:inherit}
input:focus{outline:3px solid #E8B64A;outline-offset:1px}
button:focus-visible{outline:3px solid #E8B64A;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F6F5F1; color: #17211B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap;">

  <aside style="flex: 1 1 420px; background: #1F4D3A; color: #FFFFFF; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; min-height: 320px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="0" y="0" width="48" height="48" rx="12" fill="#F6F5F1"></rect>
        <rect x="10" y="12" width="24" height="5" rx="2.5" fill="#1F4D3A"></rect>
        <rect x="10" y="21.5" width="18" height="5" rx="2.5" fill="#1F4D3A" fill-opacity="0.8"></rect>
        <rect x="10" y="31" width="11" height="5" rx="2.5" fill="#1F4D3A" fill-opacity="0.6"></rect>
        <path d="M26 32.5 L30 36.5 L38.5 27" fill="none" stroke="#C99528" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px;">Listo<span style="color: #E8B64A;">.</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 460px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: -1px;">El listado de tu escuela, ya ordenado.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #D5E3D9;">Elegís la materia y el turno; Listo te muestra a quién ofrecerle la suplencia según el orden del Decreto 900/23.</p>
    </div>
    <span style="font-size: 13px; color: #B9CFC0;">E.E.S. N.º [número] · [distrito]</span>
  </aside>

  <main style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box;">
    <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.3px;">Ingresar al panel</h2>
        <p style="margin: 0; font-size: 15px; color: #4A534D;">Acceso solo para la dirección de la escuela.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="l-email" style="font-size: 14px; font-weight: 600;">Email</label>
        <input id="l-email" type="email" autocomplete="username" placeholder="direccion@ejemplo.com" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9C6BC; border-radius: 10px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17211B;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="l-pass" style="font-size: 14px; font-weight: 600;">Contraseña</label>
        <input id="l-pass" type="password" autocomplete="current-password" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9C6BC; border-radius: 10px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17211B;">
      </div>
      <a href="Listado.dc.html" style="min-height: 50px; border-radius: 12px; background: #1F4D3A; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: 4px;">Ingresar</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
